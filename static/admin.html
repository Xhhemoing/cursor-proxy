<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CFP-RS · 号池与计费控制台</title>
<style>
:root{
  --bg:#0b0f14; --panel:#12181f; --panel2:#0e141a; --border:#1f2a33;
  --text:#e6edf3; --muted:#8b98a5; --accent:#4da3ff; --ok:#3fb950;
  --warn:#d29922; --bad:#f85149; --chip:#1c2733; --hover:#18222b;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden}
a{color:var(--accent);text-decoration:none}
button{font:inherit;cursor:pointer;border:1px solid var(--border);background:var(--chip);color:var(--text);border-radius:6px;padding:5px 12px;transition:.15s}
button:hover{background:var(--hover);border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#04121f;font-weight:600}
button.danger{background:transparent;border-color:var(--bad);color:var(--bad)}
button.danger:hover{background:var(--bad);color:#fff}
button:disabled{opacity:.45;cursor:not-allowed}
input,select{font:inherit;background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:5px 10px;outline:none}
input:focus,select:focus{border-color:var(--accent)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#26333f;border-radius:6px;border:2px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}

/* ===== 布局骨架 ===== */
#app{display:flex;height:100vh}
#sidebar{width:200px;flex:0 0 200px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:16px 0}
#sidebar .brand{padding:0 20px 18px;font-size:16px;font-weight:700;letter-spacing:.5px}
#sidebar .brand small{display:block;color:var(--muted);font-weight:400;font-size:11px;margin-top:2px}
.nav-item{padding:10px 20px;color:var(--muted);cursor:pointer;border-left:3px solid transparent;display:flex;align-items:center;gap:10px;user-select:none}
.nav-item:hover{background:var(--hover);color:var(--text)}
.nav-item.active{color:var(--text);border-left-color:var(--accent);background:var(--hover)}
.nav-item .ico{width:18px;text-align:center}
#sidebar .foot{margin-top:auto;padding:14px 20px;color:var(--muted);font-size:11px;border-top:1px solid var(--border)}
#main{flex:1;overflow:hidden;display:flex;flex-direction:column}
.page{flex:1;overflow:hidden;display:none;flex-direction:column}
.page.active{display:flex}
.page-head{padding:16px 24px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.page-head h2{font-size:18px;font-weight:600}
.page-head .spacer{flex:1}
.page-body{flex:1;overflow:auto;padding:16px 24px}

/* ===== 统计卡片 ===== */
.stat-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.stat{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px 18px;min-width:130px;flex:1}
.stat .label{color:var(--muted);font-size:12px}
.stat .value{font-size:24px;font-weight:700;font-family:var(--mono);margin-top:2px}
.stat .value.ok{color:var(--ok)} .stat .value.warn{color:var(--warn)} .stat .value.bad{color:var(--bad)} .stat .value.accent{color:var(--accent)}
.stat .sub{color:var(--muted);font-size:11px;margin-top:2px}

/* ===== 工具条 ===== */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar .grow{flex:1}
.search-box{position:relative}
.search-box input{padding-left:30px;width:240px}
.search-box::before{content:"🔍";position:absolute;left:9px;top:50%;transform:translateY(-50%);font-size:12px;opacity:.6}

/* ===== 虚拟滚动表格 ===== */
.vtable-wrap{background:var(--panel);border:1px solid var(--border);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;flex:1;min-height:200px}
.vtable-head{display:flex;background:var(--panel2);border-bottom:1px solid var(--border);font-size:12px;color:var(--muted);font-weight:600;position:sticky;top:0;z-index:2}
.vtable-head .th{padding:10px 12px;cursor:pointer;user-select:none;white-space:nowrap;display:flex;align-items:center;gap:4px}
.vtable-head .th:hover{color:var(--text)}
.vtable-head .th .arrow{font-size:10px;color:var(--accent)}
.vtable-body{flex:1;overflow:auto;position:relative}
.vtable-row{display:flex;border-bottom:1px solid var(--border);align-items:center;position:absolute;left:0;right:0}
.vtable-row:hover{background:var(--hover)}
.vtable-row.selected{background:rgba(77,163,255,.08)}
.vtable-row .td{padding:8px 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.col-check{flex:0 0 36px;text-align:center}
.col-id{flex:1 1 200px;min-width:160px;font-family:var(--mono)}
.col-status{flex:0 0 130px}
.col-health{flex:0 0 110px}
.col-quota{flex:1 1 240px;min-width:180px}
.col-req{flex:0 0 90px;text-align:right}
.col-err{flex:0 0 110px;text-align:right}
.col-tokens{flex:0 0 120px;text-align:right;font-family:var(--mono)}
.col-actions{flex:0 0 210px;text-align:right}

/* ===== 徽章 / 标签 ===== */
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.badge.ok{background:rgba(63,185,80,.15);color:var(--ok)}
.badge.warn{background:rgba(210,153,34,.15);color:var(--warn)}
.badge.bad{background:rgba(248,81,73,.15);color:var(--bad)}
.badge.mut{background:var(--chip);color:var(--muted)}
.hbar{width:56px;height:6px;background:var(--chip);border-radius:3px;overflow:hidden;display:inline-block;vertical-align:middle;margin-right:6px}
.hbar>i{display:block;height:100%;border-radius:3px}
.mono{font-family:var(--mono)}
.mut{color:var(--muted)}
.icon-btn{border:none;background:transparent;padding:3px 6px;font-size:13px;border-radius:5px;color:var(--muted)}
.icon-btn:hover{background:var(--hover);color:var(--text)}

/* ===== 计费页 ===== */
.billing-grid{display:grid;grid-template-columns:280px 1fr;gap:16px;flex:1;min-height:0}
.price-panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px;overflow:auto}
.price-panel h3{font-size:14px;margin-bottom:12px}
.price-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.price-row input{width:90px;font-family:var(--mono);font-size:12px}
.price-row .pname{flex:1;font-size:12px}
.usage-panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;display:flex;flex-direction:column;overflow:hidden}
.usage-tabs{display:flex;border-bottom:1px solid var(--border);background:var(--panel2)}
.usage-tabs .tab{padding:9px 18px;cursor:pointer;color:var(--muted);font-size:13px;border-bottom:2px solid transparent}
.usage-tabs .tab.active{color:var(--text);border-bottom-color:var(--accent)}
.usage-table{flex:1;overflow:auto}
.usage-table table{width:100%;border-collapse:collapse;font-size:13px}
.usage-table th{position:sticky;top:0;background:var(--panel2);text-align:left;padding:9px 12px;color:var(--muted);font-size:12px;border-bottom:1px solid var(--border);cursor:pointer;white-space:nowrap}
.usage-table td{padding:8px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
.usage-table tr:hover td{background:var(--hover)}
.usage-table td.num, .usage-table th.num{text-align:right;font-family:var(--mono)}

/* ===== 日志页 ===== */
.log-table{width:100%;border-collapse:collapse;font-size:12px;font-family:var(--mono)}
.log-table th{position:sticky;top:0;background:var(--panel2);text-align:left;padding:8px 10px;color:var(--muted);border-bottom:1px solid var(--border)}
.log-table td{padding:6px 10px;border-bottom:1px solid var(--border);vertical-align:top}
.log-table tr:hover td{background:var(--hover)}

/* ===== 密钥/设置 ===== */
.card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:18px;margin-bottom:16px}
.card h3{font-size:15px;margin-bottom:14px}
table.simple{width:100%;border-collapse:collapse;font-size:13px}
table.simple th{text-align:left;padding:8px 10px;color:var(--muted);font-size:12px;border-bottom:1px solid var(--border)}
table.simple td{padding:8px 10px;border-bottom:1px solid var(--border)}
.form-row{display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.form-row label{width:170px;color:var(--muted);font-size:13px}

/* ===== Toast / 弹窗 ===== */
#toast{position:fixed;top:18px;right:18px;z-index:99;display:flex;flex-direction:column;gap:8px}
.toast-item{background:var(--panel);border:1px solid var(--border);border-left:3px solid var(--ok);border-radius:8px;padding:10px 16px;font-size:13px;box-shadow:0 4px 16px rgba(0,0,0,.4);animation:slidein .2s}
.toast-item.err{border-left-color:var(--bad)}
@keyframes slidein{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
#modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:50}
#modal-mask.show{display:flex}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:22px;width:560px;max-width:92vw;max-height:84vh;overflow:auto}
.modal h3{margin-bottom:14px;font-size:16px}
.modal textarea{width:100%;min-height:180px;background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:10px;font-family:var(--mono);font-size:12px;resize:vertical}
.modal .actions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}
.empty-state{padding:40px;text-align:center;color:var(--muted)}
.loading{padding:20px;text-align:center;color:var(--muted)}
.refresh-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px;animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.progress-wrap{height:6px;background:var(--chip);border-radius:3px;overflow:hidden;margin-top:8px}
.progress-wrap>i{display:block;height:100%;background:var(--accent);transition:width .3s}
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand">CFP-RS<small>号池 · 计费控制台</small></div>
    <div class="nav-item active" data-page="pool"><span class="ico">🗂️</span>号池管理</div>
    <div class="nav-item" data-page="billing"><span class="ico">💰</span>计费分析</div>
    <div class="nav-item" data-page="keys"><span class="ico">🔑</span>API 密钥</div>
    <div class="nav-item" data-page="logs"><span class="ico">📜</span>请求日志</div>
    <div class="nav-item" data-page="settings"><span class="ico">⚙️</span>设置</div>
    <div class="foot" id="foot-status">未连接</div>
  </aside>
  <main id="main">
    <!-- 号池页 -->
    <section class="page active" id="page-pool">
      <div class="page-head">
        <h2>号池管理</h2>
        <span class="mut" id="pool-refresh-info"></span>
        <div class="spacer"></div>
        <button id="btn-import">📥 导入</button>
        <button id="btn-export">📤 导出</button>
        <button id="btn-add-account" class="primary">＋ 新增账号</button>
        <button id="btn-probe-all">🔄 全量探测</button>
        <button id="btn-refresh-pool">↻ 刷新</button>
      </div>
      <div class="page-body" style="display:flex;flex-direction:column">
        <div class="stat-row" id="pool-stats"></div>
        <div class="toolbar">
          <div class="search-box"><input id="acc-search" placeholder="搜索账号 ID…"></div>
          <select id="acc-filter">
            <option value="">全部状态</option>
            <option value="available">可用</option>
            <option value="enabled">已启用</option>
            <option value="disabled">已禁用</option>
            <option value="cooldown">冷却中</option>
            <option value="quota">额度耗尽</option>
            <option value="unhealthy">健康分&lt;50</option>
          </select>
          <select id="acc-sort">
            <option value="id">按 ID</option>
            <option value="health">按健康分</option>
            <option value="requests">按请求数</option>
            <option value="errors">按错误数</option>
            <option value="tokens">按 Token 用量</option>
          </select>
          <span class="mut" id="acc-count"></span>
          <div class="grow"></div>
          <span class="mut" id="sel-count">已选 0 项</span>
          <button id="batch-enable" disabled>启用</button>
          <button id="batch-disable" disabled>禁用</button>
          <button id="batch-clearcd" disabled>清冷却</button>
          <button id="batch-delete" class="danger" disabled>删除</button>
        </div>
        <div class="vtable-wrap">
          <div class="vtable-head" id="acc-head"></div>
          <div class="vtable-body" id="acc-body"><div class="loading">加载中…</div></div>
        </div>
      </div>
    </section>

    <!-- 计费页 -->
    <section class="page" id="page-billing">
      <div class="page-head">
        <h2>计费分析</h2>
        <span class="mut">基于请求日志实时聚合（最近 <span id="billing-n">500</span> 条）</span>
        <div class="spacer"></div>
        <select id="billing-range">
          <option value="500">最近 500 条</option>
          <option value="200">最近 200 条</option>
          <option value="100">最近 100 条</option>
        </select>
        <button id="btn-refresh-billing" class="primary">↻ 重新聚合</button>
      </div>
      <div class="page-body" style="display:flex;flex-direction:column">
        <div class="stat-row" id="billing-stats"></div>
        <div class="billing-grid">
          <div class="price-panel">
            <h3>💲 单价配置（每 1K tokens）</h3>
            <div id="price-list"></div>
            <button id="btn-add-price" style="margin-top:8px;width:100%">＋ 添加模型单价</button>
            <div class="mut" style="font-size:11px;margin-top:14px;line-height:1.6">
              单价保存在浏览器本地。未配置单价的模型按「默认单价」计费。<br><br>
              <div class="form-row"><label style="width:auto">默认 input $/1K</label><input id="def-in" type="number" step="0.0001" style="width:90px"></div>
              <div class="form-row"><label style="width:auto">默认 output $/1K</label><input id="def-out" type="number" step="0.0001" style="width:90px"></div>
            </div>
          </div>
          <div class="usage-panel">
            <div class="usage-tabs">
              <div class="tab active" data-dim="account">按账号</div>
              <div class="tab" data-dim="model">按模型</div>
              <div class="tab" data-dim="key">按 API Key</div>
            </div>
            <div class="usage-table" id="usage-table"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- 密钥页 -->
    <section class="page" id="page-keys">
      <div class="page-head"><h2>API 密钥</h2><div class="spacer"></div>
        <button id="btn-add-key" class="primary">＋ 新增密钥</button>
        <button id="btn-refresh-keys">↻ 刷新</button>
      </div>
      <div class="page-body"><div class="card"><div id="keys-table"></div></div></div>
    </section>

    <!-- 日志页 -->
    <section class="page" id="page-logs">
      <div class="page-head"><h2>请求日志</h2><div class="spacer"></div>
        <button id="btn-refresh-logs">↻ 刷新</button>
      </div>
      <div class="page-body">
        <div class="toolbar">
          <input id="log-model" placeholder="模型">
          <input id="log-account" placeholder="账号 ID">
          <select id="log-status"><option value="">全部状态</option><option value="200">200</option><option value="400">400</option><option value="429">429</option><option value="500">500</option><option value="502">502</option></select>
          <select id="log-stream"><option value="">流式/非流式</option><option value="true">流式</option><option value="false">非流式</option></select>
          <input id="log-ip" placeholder="客户端 IP">
          <select id="log-n"><option value="100">100 条</option><option value="200">200 条</option><option value="500" selected>500 条</option></select>
          <button id="btn-log-query" class="primary">查询</button>
        </div>
        <div class="card" style="padding:0;overflow:auto;flex:1"><div id="logs-table" style="min-width:900px"></div></div>
      </div>
    </section>

    <!-- 设置页 -->
    <section class="page" id="page-settings">
      <div class="page-head"><h2>设置</h2><div class="spacer"></div><button id="btn-refresh-settings">↻ 刷新</button></div>
      <div class="page-body"><div class="card" id="settings-card"><div class="loading">加载中…</div></div></div>
    </section>
  </main>
</div>

<div id="toast"></div>
<div id="modal-mask"><div class="modal" id="modal-box"></div></div>

<script>
"use strict";
/* ================= 工具 ================= */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
function el(tag, attrs, text){ const n=document.createElement(tag); if(attrs) for(const k in attrs) n.setAttribute(k,attrs[k]); if(text!=null) n.textContent=text; return n; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtNum(n){ if(n==null||isNaN(n)) return '0'; n=Number(n); if(n>=1e9) return (n/1e9).toFixed(2)+'B'; if(n>=1e6) return (n/1e6).toFixed(2)+'M'; if(n>=1e3) return (n/1e3).toFixed(1)+'K'; return String(n); }
function fmtFull(n){ return (n==null||isNaN(n))?'0':Number(n).toLocaleString('en-US'); }
function fmtMoney(n){ return '$'+(Number(n)||0).toFixed(4); }
function fmtTime(ts){ if(!ts) return '-'; const d=new Date(ts); return d.toLocaleString('zh-CN',{hour12:false}); }
function toast(msg, err){ const t=el('div',{class:'toast-item'+(err?' err':'')},msg); $('#toast').appendChild(t); setTimeout(()=>t.remove(), 3500); }
function token(){ return new URLSearchParams(location.search).get('token')||''; }
async function api(path, opt){
  const q=token(); const url=q?(path+(path.includes('?')?'&':'?')+'token='+encodeURIComponent(q)):path;
  const headers={'content-type':'application/json'}; if(q) headers['authorization']='Bearer '+q;
  const r=await fetch(url, Object.assign({headers}, opt||{}));
  const text=await r.text(); let data={}; try{ data=text?JSON.parse(text):{}; }catch(e){ data={error:text}; }
  if(!r.ok) throw new Error(data.error||r.status+' '+path);
  return data;
}
function openModal(html){ const m=$('#modal-box'); m.innerHTML=html; $('#modal-mask').classList.add('show'); return m; }
function closeModal(){ $('#modal-mask').classList.remove('show'); }
$('#modal-mask').addEventListener('click', e=>{ if(e.target.id==='modal-mask') closeModal(); });

/* ================= 全局状态 ================= */
const S = {
  accounts: [],          // 全量账号（含 stats/health/quota）
  accTokens: {},         // account -> total_tokens（从日志聚合）
  filtered: [],          // 筛选+排序后
  selected: new Set(),
  sortKey: 'id', sortAsc: true,
  prices: JSON.parse(localStorage.getItem('cfp_prices')||'{}'),   // model -> {in,out}
  defIn: +(localStorage.getItem('cfp_def_in')||'0.002'),
  defOut: +(localStorage.getItem('cfp_def_out')||'0.006'),
  logs: [],
  billingDim: 'account',
  billingRows: [],
  billSortKey: 'cost', billAsc: false,
  autoTimer: null,
};

/* ================= 导航 ================= */
$$('.nav-item').forEach(n=>n.addEventListener('click', ()=>{
  $$('.nav-item').forEach(x=>x.classList.remove('active')); n.classList.add('active');
  $$('.page').forEach(p=>p.classList.remove('active'));
  const pg=n.dataset.page; $('#page-'+pg).classList.add('active');
  if(pg==='pool') loadPool();
  if(pg==='billing') loadBilling();
  if(pg==='keys') loadKeys();
  if(pg==='logs') loadLogs();
  if(pg==='settings') loadSettings();
}));

/* ================= 号池页 ================= */
const COLS = [
  {k:'check', label:'', cls:'col-check'},
  {k:'id', label:'账号 ID', cls:'col-id'},
  {k:'status', label:'状态', cls:'col-status'},
  {k:'health', label:'健康分', cls:'col-health'},
  {k:'quota', label:'额度', cls:'col-quota'},
  {k:'requests', label:'请求', cls:'col-req'},
  {k:'errors', label:'错误/连错', cls:'col-err'},
  {k:'tokens', label:'Tokens', cls:'col-tokens'},
  {k:'actions', label:'操作', cls:'col-actions'},
];
const ROW_H = 41;

function renderHead(){
  const h=$('#acc-head'); h.replaceChildren();
  COLS.forEach(c=>{
    const th=el('div',{class:'th '+c.cls});
    if(c.k==='check'){
      const cb=el('input',{type:'checkbox'}); cb.title='全选（当前筛选）';
      cb.checked = S.filtered.length>0 && S.filtered.every(a=>S.selected.has(a.id));
      cb.addEventListener('change', ()=>{ if(cb.checked) S.filtered.forEach(a=>S.selected.add(a.id)); else S.filtered.forEach(a=>S.selected.delete(a.id)); renderBody(); updateSelBar(); renderHead(); });
      th.appendChild(cb);
    } else {
      th.textContent=c.label;
      if(['id','health','requests','errors','tokens'].includes(c.k)){
        if(S.sortKey===c.k) th.appendChild(el('span',{class:'arrow'}, S.sortAsc?'▲':'▼'));
        th.addEventListener('click', ()=>{ if(S.sortKey===c.k) S.sortAsc=!S.sortAsc; else {S.sortKey=c.k; S.sortAsc=true;} applyFilter(); });
      }
    }
    h.appendChild(th);
  });
}

function statusOf(a){
  if(a.cooldown) return ['冷却 '+(a.cooldown_remaining_secs||0)+'s','warn'];
  if(!a.enabled) return ['已禁用','mut'];
  if(!a.quota_ok) return ['额度耗尽','bad'];
  return ['正常','ok'];
}
function fmtQuota(q){
  if(!q) return '<span class="mut">未探测</span>';
  const bits=[];
  if(q.plan) bits.push(esc(q.plan));
  if(q.usage_percent!=null) bits.push('Sand '+q.usage_percent+'%');
  if(q.total_percent_used!=null) bits.push('总 '+q.total_percent_used+'%');
  if(q.has_available_usage===false) bits.push('<span style="color:var(--bad)">无余量</span>');
  if(q.error) bits.push('<span style="color:var(--bad)">err</span>');
  return bits.join(' · ')||'<span class="mut">无数据</span>';
}
function healthCell(a){
  const s=a.health_score;
  if(s==null) return '<span class="mut">-</span>';
  const color = s>=80?'var(--ok)': s>=50?'var(--warn)':'var(--bad)';
  return `<span class="hbar"><i style="width:${s}%;background:${color}"></i></span><span class="mono">${s}</span>`;
}

function applyFilter(){
  const search=($('#acc-search').value||'').toLowerCase();
  const filter=$('#acc-filter').value;
  let rows=S.accounts.filter(a=>{
    if(search && !a.id.toLowerCase().includes(search)) return false;
    if(filter==='available' && !a.available) return false;
    if(filter==='enabled' && !a.enabled) return false;
    if(filter==='disabled' && a.enabled) return false;
    if(filter==='cooldown' && !a.cooldown) return false;
    if(filter==='quota' && a.quota_ok) return false;
    if(filter==='unhealthy' && (a.health_score==null||a.health_score>=50)) return false;
    return true;
  });
  const k=S.sortKey, asc=S.sortAsc?1:-1;
  rows.sort((x,y)=>{
    let xv,yv;
    if(k==='id'){ xv=x.id; yv=y.id; return asc*String(xv).localeCompare(String(yv)); }
    if(k==='health'){ xv=x.health_score??-1; yv=y.health_score??-1; }
    else if(k==='requests'){ xv=x.stats?.requests||0; yv=y.stats?.requests||0; }
    else if(k==='errors'){ xv=x.stats?.errors||0; yv=y.stats?.errors||0; }
    else if(k==='tokens'){ xv=S.accTokens[x.id]||0; yv=S.accTokens[y.id]||0; }
    return asc*(xv-yv);
  });
  S.filtered=rows;
  $('#acc-count').textContent=`共 ${rows.length} / ${S.accounts.length} 个账号`;
  renderHead(); renderBody();
}

/* ---- 虚拟滚动 ---- */
function renderBody(){
  const body=$('#acc-body'); body.replaceChildren();
  const rows=S.filtered;
  if(!rows.length){ body.innerHTML='<div class="empty-state">没有匹配的账号</div>'; return; }
  const total=rows.length;
  const spacer=el('div'); spacer.style.height=(total*ROW_H)+'px'; spacer.style.position='relative';
  body.appendChild(spacer);
  const vp=el('div'); vp.style.position='absolute'; vp.style.inset='0'; spacer.appendChild(vp);

  function paint(){
    const scrollTop=body.scrollTop;
    const viewH=body.clientHeight;
    const start=Math.max(0, Math.floor(scrollTop/ROW_H)-5);
    const end=Math.min(total, Math.ceil((scrollTop+viewH)/ROW_H)+5);
    vp.replaceChildren();
    for(let i=start;i<end;i++){
      const a=rows[i];
      const row=el('div',{class:'vtable-row'+(S.selected.has(a.id)?' selected':'')});
      row.style.top=(i*ROW_H)+'px'; row.style.height=ROW_H+'px';
      const [stText,stCls]=statusOf(a);
      const err=a.stats?.errors||0, cerr=a.stats?.consecutive_errors||0, req=a.stats?.requests||0;
      const tok=S.accTokens[a.id]||0;
      row.innerHTML=`
        <div class="td col-check"><input type="checkbox" data-id="${esc(a.id)}" ${S.selected.has(a.id)?'checked':''}></div>
        <div class="td col-id" title="${esc(a.id)}">${esc(a.id)}</div>
        <div class="td col-status"><span class="badge ${stCls}">${stText}</span></div>
        <div class="td col-health">${healthCell(a)}</div>
        <div class="td col-quota" style="font-size:12px">${fmtQuota(a.quota)}</div>
        <div class="td col-req mono">${fmtNum(req)}</div>
        <div class="td col-err mono">${err}${cerr?` <span style="color:var(--bad)">(${cerr})</span>`:''}</div>
        <div class="td col-tokens" title="${fmtFull(tok)}">${fmtNum(tok)}</div>
        <div class="td col-actions">
          <button class="icon-btn" data-act="toggle" data-id="${esc(a.id)}" title="${a.enabled?'禁用':'启用'}">${a.enabled?'⏸':'▶️'}</button>
          <button class="icon-btn" data-act="probe" data-id="${esc(a.id)}" title="探测额度">🔍</button>
          <button class="icon-btn" data-act="clearcd" data-id="${esc(a.id)}" title="清除冷却">🧊</button>
          <button class="icon-btn" data-act="del" data-id="${esc(a.id)}" title="删除">🗑️</button>
        </div>`;
      vp.appendChild(row);
    }
  }
  body.onscroll=()=>requestAnimationFrame(paint);
  paint();
}

async function batchOp(op, label){
  const ids=[...S.selected]; if(!ids.length) return;
  if(op==='delete' && !confirm(`确认删除 ${ids.length} 个账号？`)) return;
  
  // 显示进度条（使用 textContent 防 XSS）
  const progressId = 'batch-progress-' + Date.now();
  const progressDiv = document.createElement('div');
  progressDiv.id = progressId;
  progressDiv.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--panel);border:1px solid var(--line);padding:20px;z-index:1000;min-width:300px;';
  const labelDiv = document.createElement('div');
  labelDiv.style.marginBottom = '10px';
  labelDiv.textContent = label + '中... ';
  const countSpan = document.createElement('span');
  countSpan.id = progressId + '-text';
  countSpan.textContent = '0/' + ids.length;
  labelDiv.appendChild(countSpan);
  const progressBar = document.createElement('progress');
  progressBar.id = progressId + '-bar';
  progressBar.max = ids.length;
  progressBar.value = 0;
  progressBar.style.cssText = 'width:100%;height:20px;';
  progressDiv.appendChild(labelDiv);
  progressDiv.appendChild(progressBar);
  document.body.appendChild(progressDiv);
  
  let done = 0;
  const updateProgress = () => {
    done++;
    const bar = document.getElementById(progressId+'-bar');
    const text = document.getElementById(progressId+'-text');
    if(bar) bar.value = done;
    if(text) text.textContent = done + '/' + ids.length;
  };
  
  try{
    // 并发执行，每完成一个更新进度
    await Promise.all(ids.map(async id => {
      try{
        if(op==='enable') await api('/admin/api/accounts/'+encodeURIComponent(id)+'/enabled',{method:'POST',body:JSON.stringify({enabled:true})});
        else if(op==='disable') await api('/admin/api/accounts/'+encodeURIComponent(id)+'/enabled',{method:'POST',body:JSON.stringify({enabled:false})});
        else if(op==='clear_cooldown') await api('/admin/api/accounts/'+encodeURIComponent(id)+'/cooldown/clear',{method:'POST'});
        else if(op==='delete') await api('/admin/api/accounts/'+encodeURIComponent(id),{method:'DELETE'});
      }catch(e){ console.error('batch op failed for', id, e); }
      updateProgress();
    }));
    
    toast(label+' 完成：'+ids.length+' 个');
    if(op==='delete'||op==='disable') ids.forEach(i=>S.selected.delete(i));
    updateSelBar(); loadPool(true);
  }catch(e){ toast(e.message,true); }
  finally{
    document.getElementById(progressId)?.remove();
  }
}

async function loadPool(keepScroll){

      api('/admin/api/accounts'),

function aggregateBilling(){
  const groups={};
  S.logs.forEach(l=>{
    if(l.status!==200) return;
    let key;
    if(S.billingDim==='account') key=l.account||'(未知)';
    else if(S.billingDim==='model') key=l.model||'(未知)';
    else key=l.client_ip||'(无 IP)';   // key 维度暂以 IP 区分调用方；API key 用量见密钥页
    if(!groups[key]) groups[key]={key, reqs:0, inTok:0, outTok:0, lat:0, latN:0};
    const g=groups[key];
    g.reqs++; g.inTok+=l.input_tokens||0; g.outTok+=l.output_tokens||0;
    if(l.latency_ms!=null){ g.lat+=l.latency_ms; g.latN++; }
  });
  const rows=Object.values(groups).map(g=>{
    const models=[...new Set(S.logs.filter(l=>(S.billingDim==='account'?l.account:S.billingDim==='model'?l.model:l.client_ip)===g.key && l.status===200).map(l=>l.model))];
    // 成本：逐条按模型单价累加
    let cost=0;
    S.logs.forEach(l=>{
      const k=S.billingDim==='account'?l.account:S.billingDim==='model'?l.model:l.client_ip;
      if(k!==g.key||l.status!==200) return;
      const p=priceOf(l.model);
      cost += (l.input_tokens||0)/1000*p.in + (l.output_tokens||0)/1000*p.out;
    });
    return { key:g.key, reqs:g.reqs, inTok:g.inTok, outTok:g.outTok, totTok:g.inTok+g.outTok, avgLat:g.latN?Math.round(g.lat/g.latN):0, cost, models:models.slice(0,3).join(', ') };
  });
  S.billingRows=rows;
  renderBillingStats(rows);
  renderUsageTable();
}
function renderBillingStats(rows){
  const totReq=rows.reduce((s,r)=>s+r.reqs,0);
  const totIn=rows.reduce((s,r)=>s+r.inTok,0);
  const totOut=rows.reduce((s,r)=>s+r.outTok,0);
  const totCost=rows.reduce((s,r)=>s+r.cost,0);
  const avgLat=rows.length?Math.round(rows.reduce((s,r)=>s+r.avgLat*r.reqs,0)/(totReq||1)):0;
  $('#billing-stats').innerHTML=`
    <div class="stat"><div class="label">成功请求</div><div class="value accent">${fmtNum(totReq)}</div></div>
    <div class="stat"><div class="label">Input Tokens</div><div class="value" title="${fmtFull(totIn)}">${fmtNum(totIn)}</div></div>
    <div class="stat"><div class="label">Output Tokens</div><div class="value" title="${fmtFull(totOut)}">${fmtNum(totOut)}</div></div>
    <div class="stat"><div class="label">总 Tokens</div><div class="value accent" title="${fmtFull(totIn+totOut)}">${fmtNum(totIn+totOut)}</div></div>
    <div class="stat"><div class="label">估算成本</div><div class="value ok">${fmtMoney(totCost)}</div></div>
    <div class="stat"><div class="label">平均延迟</div><div class="value">${avgLat} ms</div></div>`;
}
function renderUsageTable(){
  const box=$('#usage-table');
  const rows=[...S.billingRows];
  const k=S.billSortKey, asc=S.billAsc?1:-1;
  rows.sort((a,b)=>{ const r = k==='key'? String(a.key).localeCompare(String(b.key)) : (a[k]-b[k]); return asc*r; });
  if(!rows.length){ box.innerHTML='<div class="empty-state">暂无用量数据（发起请求后点击「重新聚合」）</div>'; return; }
  const dimLabel = S.billingDim==='account'?'账号':S.billingDim==='model'?'模型':'调用方 IP';
  const th=(label,key,num)=>`<th class="${num?'num':''}" data-sk="${key}">${label}${S.billSortKey===key?(S.billAsc?' ▲':' ▼'):''}</th>`;
  box.innerHTML=`<table><thead><tr>
    ${th(dimLabel,'key')}${S.billingDim!=='model'?th('模型','models'):''}${th('请求','reqs',1)}${th('Input','inTok',1)}${th('Output','outTok',1)}${th('总 Tokens','totTok',1)}${th('平均延迟','avgLat',1)}${th('成本','cost',1)}
  </tr></thead><tbody>${
    rows.map(r=>`<tr>
      <td class="mono" title="${esc(r.key)}">${esc(r.key.length>28?r.key.slice(0,28)+'…':r.key)}</td>
      ${S.billingDim!=='model'?`<td class="mut" style="font-size:11px">${esc(r.models)}</td>`:''}
      <td class="num">${fmtFull(r.reqs)}</td>
      <td class="num" title="${fmtFull(r.inTok)}">${fmtNum(r.inTok)}</td>
      <td class="num" title="${fmtFull(r.outTok)}">${fmtNum(r.outTok)}</td>
      <td class="num" title="${fmtFull(r.totTok)}">${fmtNum(r.totTok)}</td>
      <td class="num">${r.avgLat} ms</td>
      <td class="num" style="color:var(--ok)">${fmtMoney(r.cost)}</td>
    </tr>`).join('')
  }</tbody></table>`;
  box.querySelectorAll('th[data-sk]').forEach(h=>h.onclick=()=>{ const sk=h.dataset.sk; if(sk==='models') return; if(S.billSortKey===sk) S.billAsc=!S.billAsc; else {S.billSortKey=sk; S.billAsc=false;} renderUsageTable(); });
}
$$('.usage-tabs .tab').forEach(t=>t.onclick=()=>{ $$('.usage-tabs .tab').forEach(x=>x.classList.remove('active')); t.classList.add('active'); S.billingDim=t.dataset.dim; aggregateBilling(); });
async function loadBilling(){
  const n=$('#billing-range').value; $('#billing-n').textContent=n;
  try{ const r=await api('/admin/api/logs?n='+n); S.logs=r.logs||[]; renderPriceList(); aggregateBilling(); }
  catch(e){ toast('加载计费数据失败: '+e.message, true); }
}
$('#btn-refresh-billing').onclick=loadBilling;
$('#billing-range').onchange=loadBilling;

/* ================= 密钥页 ================= */
async function loadKeys(){
  try{
    const r=await api('/admin/api/keys');
    const keys=r.keys||[];
    if(!keys.length){ $('#keys-table').innerHTML='<div class="empty-state">暂无 API 密钥</div>'; return; }
    $('#keys-table').innerHTML=`<table class="simple"><thead><tr>
      <th>#</th><th>前缀</th><th>名称</th><th>描述</th><th>状态</th><th style="text-align:right">已用 Tokens</th><th style="text-align:right">Token 限额</th><th style="text-align:right">已用请求</th><th style="text-align:right">请求限额</th><th>过期</th><th></th>
    </tr></thead><tbody>${keys.map((k,i)=>{
      const pct=k.token_limit?Math.min(100,Math.round((k.used_tokens||0)/k.token_limit*100)):0;
      return `<tr>
        <td class="mut">${i}</td><td class="mono">${esc(k.prefix||'')}</td>
        <td>${esc(k.name||'-')}</td><td class="mut">${esc(k.description||'-')}</td>
        <td>${k.enabled?'<span class="badge ok">启用</span>':'<span class="badge mut">禁用</span>'}</td>
        <td style="text-align:right" class="mono" title="${fmtFull(k.used_tokens)}">${fmtNum(k.used_tokens)}${k.token_limit?`<div class="progress-wrap"><i style="width:${pct}%"></i></div>`:''}</td>
        <td style="text-align:right" class="mono">${k.token_limit?fmtNum(k.token_limit):'∞'}</td>
        <td style="text-align:right" class="mono">${fmtNum(k.used_requests)}</td>
        <td style="text-align:right" class="mono">${k.request_limit?fmtNum(k.request_limit):'∞'}</td>
        <td class="mut">${k.expires_at?fmtTime(k.expires_at*1000):'-'}</td>
        <td style="text-align:right"><button class="icon-btn" data-key-toggle="${i}">${k.enabled?'⏸':'▶️'}</button><button class="icon-btn" data-key-del="${i}">🗑️</button></td>
      </tr>`;}).join('')}</tbody></table>`;
    $$('#keys-table [data-key-del]').forEach(b=>b.onclick=async ()=>{ if(!confirm('删除该密钥？')) return; try{ await api('/admin/api/keys/'+b.dataset.keyDel,{method:'DELETE'}); toast('已删除'); loadKeys(); }catch(e){toast(e.message,true);} });
    $$('#keys-table [data-key-toggle]').forEach(b=>b.onclick=async ()=>{ const i=+b.dataset.keyToggle; const cur=keys[i].enabled; try{ await api('/admin/api/keys/'+i,{method:'POST',body:JSON.stringify({enabled:!cur})}); loadKeys(); }catch(e){toast(e.message,true);} });
  }catch(e){ toast('加载密钥失败: '+e.message,true); }
}
$('#btn-refresh-keys').onclick=loadKeys;
$('#btn-add-key').onclick=()=>{
  const m=openModal(`<h3>＋ 新增 API 密钥</h3>
    <div class="form-row"><label>密钥值</label><input id="nk-key" style="flex:1" placeholder="sk-... (≥16字符)"></div>
    <div class="form-row"><label>名称</label><input id="nk-name" style="flex:1"></div>
    <div class="form-row"><label>Token 限额</label><input id="nk-tok" type="number" style="flex:1" placeholder="留空 = 不限"></div>
    <div class="form-row"><label>请求限额</label><input id="nk-req" type="number" style="flex:1" placeholder="留空 = 不限"></div>
    <div class="actions"><button onclick="closeModal()">取消</button><button class="primary" id="nk-go">创建</button></div>`);
  m.querySelector('#nk-go').onclick=async ()=>{
    const body={key:m.querySelector('#nk-key').value.trim(), name:m.querySelector('#nk-name').value.trim()};
    const tok=m.querySelector('#nk-tok').value, req=m.querySelector('#nk-req').value;
    if(tok) body.token_limit=+tok; if(req) body.request_limit=+req;
    if(!body.key) return toast('密钥必填',true);
    try{ await api('/admin/api/keys',{method:'POST',body:JSON.stringify(body)}); toast('已创建'); closeModal(); loadKeys(); }catch(e){ toast(e.message,true); }
  };
};

/* ================= 日志页 ================= */
async function loadLogs(){
  const p=new URLSearchParams();
  p.set('n', $('#log-n').value);
  if($('#log-model').value) p.set('model', $('#log-model').value);
  if($('#log-account').value) p.set('account', $('#log-account').value);
  if($('#log-status').value) p.set('status', $('#log-status').value);
  if($('#log-stream').value) p.set('stream', $('#log-stream').value);
  if($('#log-ip').value) p.set('client_ip', $('#log-ip').value);
  try{
    const r=await api('/admin/api/logs?'+p.toString());
    const logs=r.logs||[];
    if(!logs.length){ $('#logs-table').innerHTML='<div class="empty-state">暂无日志</div>'; return; }
    $('#logs-table').innerHTML=`<table class="log-table"><thead><tr>
      <th>时间</th><th>模型</th><th>账号</th><th style="text-align:right">In</th><th style="text-align:right">Out</th><th style="text-align:right">Total</th><th style="text-align:right">延迟</th><th>状态</th><th>流式</th><th>客户端 IP</th>
    </tr></thead><tbody>${logs.map(l=>`<tr>
      <td class="mut">${fmtTime(l.ts)}</td><td>${esc(l.model||'-')}</td><td class="mono">${esc(l.account||'-')}</td>
      <td style="text-align:right">${fmtNum(l.input_tokens)}</td><td style="text-align:right">${fmtNum(l.output_tokens)}</td><td style="text-align:right">${fmtNum(l.total_tokens)}</td>
      <td style="text-align:right">${l.latency_ms!=null?l.latency_ms+'ms':'-'}</td>
      <td><span class="badge ${l.status===200?'ok':'bad'}">${l.status}</span></td>
      <td>${l.stream?'✓':'-'}</td><td class="mut">${esc(l.client_ip||'-')}</td>
    </tr>`).join('')}</tbody></table>`;
  }catch(e){ toast('加载日志失败: '+e.message,true); }
}
$('#btn-refresh-logs').onclick=loadLogs;
$('#btn-log-query').onclick=loadLogs;

/* ================= 设置页 ================= */
async function loadSettings(){
  try{
    const r=await api('/admin/api/settings');
    $('#settings-card').innerHTML=`<h3>运行时配置</h3>
      <div class="form-row"><label>默认模型</label><input id="st-model" value="${esc(r.default_model||'')}" style="flex:1;max-width:320px"></div>
      <div class="form-row"><label>超时（秒，10-3600）</label><input id="st-timeout" type="number" value="${r.timeout_s||''}" style="width:120px"> <span class="mut">修改后需重启</span></div>
      <div class="form-row"><label>每账号并发（1-128）</label><input id="st-conc" type="number" value="${r.max_concurrency_per_account||''}" style="width:120px"> <span class="mut">修改后需重启</span></div>
      <div class="form-row"><label>版本</label><span class="mono mut">${esc(r.version||'-')}</span></div>
      <div class="form-row"><label>上游</label><span class="mono mut">${esc((r.upstreams||[]).join(', ')||'-')}</span></div>
      <button class="primary" id="st-save">保存</button> <span class="mut" id="st-msg"></span>`;
    $('#st-save').onclick=async ()=>{
      const body={default_model:$('#st-model').value.trim()};
      const t=+$('#st-timeout').value, c=+$('#st-conc').value;
      if(t) body.timeout_s=t; if(c) body.max_concurrency_per_account=c;
      try{ const res=await api('/admin/api/settings',{method:'POST',body:JSON.stringify(body)});
        $('#st-msg').textContent = res.restart_required&&res.restart_required.length? '已保存，需重启生效: '+res.restart_required.join(', ') : '已保存并生效';
        toast('设置已保存');
      }catch(e){ toast(e.message,true); }
    };
  }catch(e){ $('#settings-card').innerHTML='<div class="empty-state">加载失败: '+esc(e.message)+'</div>'; }
}

/* ================= 启动 + 自动刷新 ================= */
loadPool();
function startAuto(){
  if(S.autoTimer) clearInterval(S.autoTimer);
  S.autoTimer=setInterval(()=>{
    const active=$('.page.active').id;
    if(active==='page-pool') loadPool(true);
    else if(active==='page-billing') loadBilling();
  }, 15000);
}
startAuto();
</script>
</body>
</html>
