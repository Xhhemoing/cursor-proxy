<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>用户门户</title>
<style>
  :root {
    --bg: #f7f7f8; --bg-2: #fff; --bg-3: #eee; --ink: #1a1a1a; --muted: #888;
    --line: #e0e0e0; --ok: #16a34a; --warn: #d97706; --bad: #dc2626; --info: #2563eb;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141416; --bg-2: #1e1e22; --bg-3: #2a2a30; --ink: #e8e8e8; --muted: #888; --line: #333; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; font: 14px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--ink); }
  .mono { font-family: var(--mono); }
  .muted { color: var(--muted); }
  button { font: inherit; padding: 6px 14px; border: 1px solid var(--ink); background: var(--ink); color: var(--bg); border-radius: 6px; cursor: pointer; }
  button.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
  button:hover { opacity: 0.85; }
  input, select { font: inherit; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg-2); color: var(--ink); }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; }
  .pill.ok { background: color-mix(in srgb, var(--ok) 15%, transparent); color: var(--ok); }
  .pill.warn { background: color-mix(in srgb, var(--warn) 15%, transparent); color: var(--warn); }
  .pill.bad { background: color-mix(in srgb, var(--bad) 15%, transparent); color: var(--bad); }

  /* 登录页 */
  #login-view { display: flex; align-items: center; justify-content: center; height: 100vh; }
  .login-box { width: 340px; padding: 32px; background: var(--bg-2); border: 1px solid var(--line); border-radius: 12px; }
  .login-box h1 { margin: 0 0 6px; font-size: 20px; }
  .login-box .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .login-box label { display: block; margin-bottom: 12px; font-size: 13px; }
  .login-box input { width: 100%; margin-top: 4px; }
  .login-box button { width: 100%; margin-top: 8px; padding: 9px; }
  .login-box .err { color: var(--bad); font-size: 12px; margin-top: 10px; min-height: 16px; }
  .login-box .tip { color: var(--muted); font-size: 12px; margin-top: 14px; text-align: center; }

  /* 主界面 */
  #app-view { display: none; height: 100vh; flex-direction: column; }
  .topbar { display: flex; align-items: center; gap: 16px; padding: 0 20px; height: 52px; background: var(--bg-2); border-bottom: 1px solid var(--line); }
  .topbar .brand { font-weight: 700; font-size: 15px; }
  .topbar nav { display: flex; gap: 4px; flex: 1; }
  .topbar nav a { padding: 6px 14px; border-radius: 6px; color: var(--muted); text-decoration: none; font-size: 13px; }
  .topbar nav a.active { background: var(--bg-3); color: var(--ink); font-weight: 600; }
  .topbar .who { font-size: 13px; }
  .topbar .bal { font-family: var(--mono); font-weight: 600; color: var(--ok); }
  main { flex: 1; overflow: auto; padding: 20px; }
  .page { display: none; max-width: 900px; margin: 0 auto; }
  .page.active { display: block; }
  .card { background: var(--bg-2); border: 1px solid var(--line); border-radius: 10px; padding: 18px; margin-bottom: 14px; }
  .card h3 { margin: 0 0 10px; font-size: 15px; }
  .stat-row { display: flex; gap: 14px; flex-wrap: wrap; }
  .stat { flex: 1; min-width: 140px; padding: 14px; background: var(--bg); border-radius: 8px; }
  .stat .l { font-size: 12px; color: var(--muted); }
  .stat .v { font: 600 22px var(--mono); margin-top: 4px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  .plan-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
  .plan-card { background: var(--bg-2); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  .plan-card h4 { margin: 0 0 4px; font-size: 15px; }
  .plan-card .price { font: 700 24px var(--mono); color: var(--ink); margin: 8px 0; }
  .plan-card .meta { font-size: 12px; color: var(--muted); margin-bottom: 12px; }
  .plan-card button { width: 100%; }
  .aff-code { font: 700 20px var(--mono); letter-spacing: 2px; padding: 10px 16px; background: var(--bg); border-radius: 8px; display: inline-block; }
  .toast { position: fixed; top: 20px; right: 20px; padding: 10px 18px; background: var(--ink); color: var(--bg); border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 99; }
  .toast.show { opacity: 1; }
  .toast.err { background: var(--bad); }
</style>
</head>
<body>

<!-- ═══════════ 登录页 ═══════════ -->
<div id="login-view">
  <div class="login-box">
    <h1>用户门户</h1>
    <div class="sub">使用账号或编号登录</div>
    <form id="login-form">
      <label>用户名 / 编号 <input id="login-user" autocomplete="username" required></label>
      <label>密码 <input id="login-pass" type="password" autocomplete="current-password" required></label>
      <button type="submit" id="login-btn">登 录</button>
      <div class="err" id="login-err"></div>
    </form>
    <div class="tip">没有账号？请联系管理员开通</div>
  </div>
</div>

<!-- ═══════════ 主界面 ═══════════ -->
<div id="app-view">
  <div class="topbar">
    <span class="brand">用户门户</span>
    <nav id="nav">
      <a href="#dashboard" data-page="dashboard" class="active">首页</a>
      <a href="#plans" data-page="plans">购买套餐</a>
      <a href="#cards" data-page="cards">我的套餐</a>
      <a href="#balance" data-page="balance">余额</a>
      <a href="#aff" data-page="aff">邀请</a>
    </nav>
    <span class="who"><span id="who-name">–</span> · 余额 <span class="bal" id="who-bal">¥0</span></span>
    <button class="ghost" id="logout-btn" style="padding:4px 10px;font-size:12px">退出</button>
  </div>
  <main>
    <!-- 首页 -->
    <div class="page active" id="page-dashboard">
      <!-- 到期提醒横幅 -->
      <div id="expiry-banner" style="display:none;background:linear-gradient(90deg,var(--warn) 0%,var(--bad) 100%);color:#fff;padding:10px 16px;border-radius:8px;margin-bottom:14px;font-size:13px">
        <span id="expiry-text"></span>
        <button class="ghost" style="background:rgba(255,255,255,0.2);border-color:transparent;color:#fff;padding:4px 12px;margin-left:12px;font-size:12px" onclick="location.hash='#plans'">立即续费</button>
      </div>
      <div class="stat-row">
        <div class="stat"><div class="l">账户余额</div><div class="v" id="d-balance">¥0</div></div>
        <div class="stat"><div class="l">我的套餐</div><div class="v" id="d-cards">0</div></div>
        <div class="stat"><div class="l">有效套餐</div><div class="v" id="d-active">0</div></div>
        <div class="stat"><div class="l">邀请人数</div><div class="v" id="d-invited">0</div></div>
      </div>
      <div class="card">
        <h3>有效套餐</h3>
        <div id="d-cards-list" class="muted">加载中…</div>
      </div>
    </div>

    <!-- 购买套餐 -->
    <div class="page" id="page-plans">
      <h2 style="margin:0 0 14px">购买套餐</h2>
      <div class="plan-grid" id="plans-grid">加载中…</div>
    </div>

    <!-- 叠加选择弹窗 -->
    <div id="stack-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:100;align-items:center;justify-content:center">
      <div style="background:var(--bg-2);border:1px solid var(--line);border-radius:12px;padding:24px;max-width:480px;width:90%">
        <h3 style="margin:0 0 12px">选择叠加方式</h3>
        <div id="stack-info" class="muted" style="font-size:13px;margin-bottom:16px"></div>
        <div id="stack-grid" style="display:grid;gap:8px;margin-bottom:16px"></div>
        <div style="display:flex;gap:8px;justify-content:flex-end">
          <button class="ghost" id="stack-cancel">取消</button>
          <button id="stack-confirm">确认购买</button>
        </div>
      </div>
    </div>

    <!-- 我的套餐 -->
    <div class="page" id="page-cards">
      <h2 style="margin:0 0 14px">我的套餐</h2>
      <div class="card">
        <table>
          <thead><tr><th>套餐</th><th>Key</th><th>状态</th><th>剩余时间</th><th>已用额度</th><th>实付</th><th></th></tr></thead>
          <tbody id="cards-body"><tr><td colspan="6" class="muted">加载中…</td></tr></tbody>
        </table>
      </div>
    </div>

    <!-- 临时叠加弹窗 -->
    <div id="boost-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:100;align-items:center;justify-content:center">
      <div style="background:var(--bg-2);border:1px solid var(--line);border-radius:12px;padding:24px;max-width:420px;width:90%">
        <h3 style="margin:0 0 12px">临时加并发</h3>
        <div id="boost-info" class="muted" style="font-size:13px;margin-bottom:16px"></div>
        <label style="display:block;margin-bottom:12px">加几个槽 (1-4) <input id="boost-slots" type="number" min="1" max="4" value="1" style="width:60px"></label>
        <div id="boost-price" style="font:600 18px var(--mono);color:var(--ok);margin-bottom:16px"></div>
        <div style="display:flex;gap:8px;justify-content:flex-end">
          <button class="ghost" id="boost-cancel">取消</button>
          <button id="boost-confirm">确认支付</button>
        </div>
      </div>
    </div>

    <!-- 余额 -->
    <div class="page" id="page-balance">
      <h2 style="margin:0 0 14px">余额管理</h2>
      <div class="stat-row">
        <div class="stat"><div class="l">当前余额</div><div class="v" id="b-current">¥0</div></div>
      </div>
      <div class="card">
        <h3>最近流水</h3>
        <table>
          <thead><tr><th>时间</th><th>金额</th><th>余额</th><th>原因</th></tr></thead>
          <tbody id="balance-log"><tr><td colspan="4" class="muted">加载中…</td></tr></tbody>
        </table>
      </div>
      <div class="card muted" style="font-size:13px">充值请联系管理员</div>
    </div>

    <!-- 邀请 -->
    <div class="page" id="page-aff">
      <h2 style="margin:0 0 14px">邀请好友</h2>
      <div class="card">
        <h3>我的邀请码</h3>
        <div class="aff-code" id="aff-code">–</div>
        <p class="muted" style="font-size:12px">好友注册时填入此码, 其首次购买后你可获得返佣</p>
      </div>
      <div class="card">
        <h3>邀请记录 (<span id="aff-count">0</span>)</h3>
        <table>
          <thead><tr><th>用户</th><th>注册时间</th></tr></thead>
          <tbody id="aff-list"><tr><td colspan="2" class="muted">暂无</td></tr></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  let token = sessionStorage.getItem('portal_token') || '';
  let me = null;

  function toast(msg, err) {
    const t = $('toast');
    t.textContent = msg;
    t.className = 'toast show' + (err ? ' err' : '');
    setTimeout(() => t.classList.remove('show'), 2600);
  }

  async function api(path, opt) {
    opt = opt || {};
    opt.headers = Object.assign({ 'content-type': 'application/json' }, opt.headers || {});
    if (token) opt.headers['authorization'] = 'Bearer ' + token;
    const r = await fetch(path, opt);
    const d = await r.json().catch(() => ({}));
    if (!r.ok) {
      if (r.status === 401) { doLogout(); throw new Error(d.error || '请重新登录'); }
      throw new Error(d.error || r.status);
    }
    return d;
  }

  function fmtTime(s) { return s ? new Date(s * 1000).toLocaleString('zh-CN', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '—'; }
  function fmtDur(secs) {
    if (!secs) return '—';
    const d = Math.floor(secs / 86400), h = Math.floor((secs % 86400) / 3600);
    return d > 0 ? d + ' 天 ' + h + ' 时' : h + ' 时';
  }

  // ── 登录 ──
  $('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    $('login-err').textContent = '';
    $('login-btn').disabled = true;
    try {
      const d = await api('/portal/api/login', {
        method: 'POST',
        body: JSON.stringify({ username_or_id: $('login-user').value.trim(), password: $('login-pass').value }),
      });
      token = d.token;
      sessionStorage.setItem('portal_token', token);
      me = d.user;
      showApp();
    } catch (err) {
      $('login-err').textContent = err.message;
    } finally {
      $('login-btn').disabled = false;
    }
  });

  function doLogout() {
    if (token) api('/portal/api/logout', { method: 'POST', body: '{}' }).catch(() => {});
    token = '';
    sessionStorage.removeItem('portal_token');
    me = null;
    $('app-view').style.display = 'none';
    $('login-view').style.display = 'flex';
  }
  $('logout-btn').addEventListener('click', doLogout);

  // ── 路由 ──
  const PAGES = ['dashboard', 'plans', 'cards', 'balance', 'aff'];
  function showPage(name) {
    if (!PAGES.includes(name)) name = 'dashboard';
    PAGES.forEach((p) => $('page-' + p).classList.toggle('active', p === name));
    document.querySelectorAll('#nav a').forEach((a) => a.classList.toggle('active', a.dataset.page === name));
    if (name === 'plans') loadPlans();
    if (name === 'cards') loadCards();
    if (name === 'balance') loadBalance();
    if (name === 'aff') loadAff();
  }
  window.addEventListener('hashchange', () => showPage(location.hash.slice(1)));

  async function showApp() {
    $('login-view').style.display = 'none';
    $('app-view').style.display = 'flex';
    $('who-name').textContent = me.username + ' (' + me.id + ')';
    $('who-bal').textContent = '¥' + me.balance_rmb.toFixed(2);
    await loadDashboard();
    showPage(location.hash.slice(1) || 'dashboard');
  }

  // ── 各页加载 ──
  async function loadDashboard() {
    try {
      const [bal, cards, aff] = await Promise.all([
        api('/portal/api/balance'), api('/portal/api/cards'), api('/portal/api/aff'),
      ]);
      $('d-balance').textContent = '¥' + (bal.balance_rmb || 0).toFixed(2);
      $('who-bal').textContent = '¥' + (bal.balance_rmb || 0).toFixed(2);

      // P0: 余额预警 (<¥20 变红)
      const balEl = $('d-balance');
      if ((bal.balance_rmb || 0) < 20) {
        balEl.style.color = 'var(--bad)';
        balEl.parentElement.style.borderColor = 'var(--bad)';
      } else {
        balEl.style.color = 'var(--ok)';
        balEl.parentElement.style.borderColor = 'var(--line)';
      }

      const list = cards.cards || [];
      $('d-cards').textContent = list.length;
      const active = list.filter((c) => c.enabled && !c.expired);
      $('d-active').textContent = active.length;
      $('d-invited').textContent = aff.invited_count || 0;

      // P0: 卡到期提醒 (24h 内到期)
      const now = Math.floor(Date.now() / 1000);
      const expiring = active.filter((c) => c.expires_at > 0 && (c.expires_at - now) < 86400);
      if (expiring.length > 0) {
        const nearest = expiring.sort((a, b) => a.expires_at - b.expires_at)[0];
        const hours = Math.floor((nearest.expires_at - now) / 3600);
        $('expiry-text').textContent = `您的「${nearest.plan_name || nearest.plan_id}」将于 ${hours} 小时后到期`;
        $('expiry-banner').style.display = 'block';
      } else {
        $('expiry-banner').style.display = 'none';
      }

      $('d-cards-list').innerHTML = active.length
        ? active.map((c) => '<div style="padding:8px 0;border-bottom:1px solid var(--line)"><b>' + esc(c.plan_name || c.plan_id) + '</b> · <span class="mono" style="font-size:12px">' + esc(c.card_key.slice(0, 16)) + '…</span> · 剩 ' + fmtDur(c.remaining_secs) + '</div>').join('')
        : '<span class="muted">暂无有效套餐, 去「购买套餐」开通</span>';
    } catch (e) { /* 401 已处理 */ }
  }

  async function loadPlans() {
    const g = $('plans-grid');
    try {
      const d = await api('/portal/api/plans');
      const plans = d.plans || [];
      if (!plans.length) { g.innerHTML = '<div class="muted">暂无可用套餐</div>'; return; }
      g.innerHTML = '';
      plans.forEach((p) => {
        const div = document.createElement('div');
        div.className = 'plan-card';
        div.innerHTML =
          '<h4>' + esc(p.name) + '</h4>' +
          '<div class="price">¥' + Number(p.price).toFixed(0) + '</div>' +
          '<div class="meta">' + esc(p.kind) + ' · ' + (p.duration_hours ? fmtDur(p.duration_hours * 3600) : '不限时') + ' · ' + p.max_concurrency + ' 并发' + (p.face_usd > 0 ? ' · $' + p.face_usd + ' 额度' : '') + '</div>' +
          (p.note ? '<div class="meta">' + esc(p.note) + '</div>' : '');
        const btn = document.createElement('button');
        btn.textContent = '购买';
        btn.addEventListener('click', () => purchase(p));
        div.appendChild(btn);
        g.appendChild(div);
      });
    } catch (e) { g.innerHTML = '<div class="muted">' + esc(e.message) + '</div>'; }
  }

  async function purchase(p) {
    // 检查是否已持有同套餐 (叠加场景)
    try {
      const d = await api('/portal/api/cards');
      const existing = (d.cards || []).find((c) => c.plan_id === p.id && c.enabled && !c.expired);
      if (existing) {
        // 弹叠加选择: 时间叠加 vs 槽位叠加
        showStackModal(p, existing);
        return;
      }
    } catch (e) { /* 忽略, 继续正常购买 */ }
    // 正常购买
    if (!confirm('购买「' + p.name + '」? 从余额扣 ¥' + Number(p.price).toFixed(2))) return;
    doPurchase(p.id, null);
  }

  function showStackModal(plan, existing) {
    const modal = $('stack-modal');
    const info = $('stack-info');
    const grid = $('stack-grid');
    const hours = plan.duration_hours || 24;
    const remaining = existing.remaining_secs || 0;
    const remHours = Math.floor(remaining / 3600);
    info.textContent = `你已持有「${plan.name}」(剩 ${remHours}h)。选择叠加方式:`;
    grid.innerHTML = '';
    // 时间叠加
    const opt1 = document.createElement('div');
    opt1.style.cssText = 'border:1px solid var(--line);border-radius:8px;padding:12px;cursor:pointer';
    opt1.innerHTML = `<b>时间叠加</b><div class="muted" style="font-size:12px;margin-top:4px">延长现有卡 +${hours}h<br>新到期: ${remHours + hours}h</div>`;
    opt1.onclick = () => selectStack('time_multiply');
    // 槽位叠加
    const opt2 = document.createElement('div');
    opt2.style.cssText = 'border:1px solid var(--line);border-radius:8px;padding:12px;cursor:pointer';
    opt2.innerHTML = `<b>槽位叠加</b><div class="muted" style="font-size:12px;margin-top:4px">新卡独立计时 ${hours}h<br>并发 +1 (同时可用 2 个槽)</div>`;
    opt2.onclick = () => selectStack('slot_multiply');
    grid.appendChild(opt1);
    grid.appendChild(opt2);
    let selected = null;
    function selectStack(mode) {
      selected = mode;
      [opt1, opt2].forEach((el, i) => {
        const isSel = (i === 0 && mode === 'time_multiply') || (i === 1 && mode === 'slot_multiply');
        el.style.borderColor = isSel ? 'var(--info)' : 'var(--line)';
        el.style.background = isSel ? 'color-mix(in srgb, var(--info) 8%, transparent)' : 'transparent';
      });
    }
    selectStack('time_multiply'); // 默认时间叠加
    $('stack-confirm').onclick = () => {
      if (!selected) return;
      modal.style.display = 'none';
      doPurchase(plan.id, selected);
    };
    $('stack-cancel').onclick = () => { modal.style.display = 'none'; };
    modal.style.display = 'flex';
  }

  async function doPurchase(planId, stackMode) {
    try {
      const body = { plan_id: planId };
      if (stackMode) body.stack_mode = stackMode;
      const d = await api('/portal/api/purchase', { method: 'POST', body: JSON.stringify(body) });
      if (d.extended) {
        toast('已延长现有卡至 ' + fmtTime(d.new_expires_at));
      } else {
        toast('购买成功! Key: ' + d.card_key.slice(0, 20) + '…');
      }
      const bal = await api('/portal/api/balance');
      $('who-bal').textContent = '¥' + (bal.balance_rmb || 0).toFixed(2);
    } catch (e) { toast(e.message, true); }
  }

  async function loadCards() {
    const tb = $('cards-body');
    try {
      const d = await api('/portal/api/cards');
      const list = d.cards || [];
      if (!list.length) { tb.innerHTML = '<tr><td colspan="6" class="muted">暂无套餐</td></tr>'; return; }
      tb.innerHTML = list.map((c) =>
        '<tr><td>' + esc(c.plan_name || c.plan_id) + '</td>' +
        '<td class="mono" style="font-size:11px" title="' + esc(c.card_key) + '">' + esc(c.card_key.slice(0, 20)) + '… <button class="ghost" style="padding:1px 6px;font-size:10px;margin-left:4px" onclick="copyKey(\'' + esc(c.card_key) + '\')">复制</button></td>' +
        '<td>' + (c.expired ? '<span class="pill bad">已过期</span>' : c.enabled ? '<span class="pill ok">使用中</span>' : '<span class="pill warn">未启用</span>') + '</td>' +
        '<td>' + fmtDur(c.remaining_secs) + '</td>' +
        '<td class="mono">$' + Number(c.face_used_usd || 0).toFixed(2) + (c.face_usd > 0 ? ' / $' + c.face_usd : '') + '</td>' +
        '<td class="mono">¥' + Number(c.paid_rmb || 0).toFixed(2) + '</td>' +
        '<td>' + (c.enabled && !c.expired ? '<button class="ghost" style="padding:2px 8px;font-size:11px" onclick="showBoost(\'' + esc(c.card_key) + '\',' + c.remaining_secs + ',' + c.paid_rmb + ',' + (c.plan_hours || 24) + ')">加并发</button>' : '') + '</td></tr>'
      ).join('');
    } catch (e) { tb.innerHTML = '<tr><td colspan="6" class="muted">' + esc(e.message) + '</td></tr>'; }
  }

  async function loadBalance() {
    try {
      const d = await api('/portal/api/balance');
      $('b-current').textContent = '¥' + (d.balance_rmb || 0).toFixed(2);
      const log = d.log || [];
      $('balance-log').innerHTML = log.length
        ? log.map((l) => '<tr><td class="mono" style="font-size:11px">' + fmtTime(l.ts_ms / 1000) + '</td><td class="mono" style="color:' + (l.delta_rmb >= 0 ? 'var(--ok)' : 'var(--bad)') + '">' + (l.delta_rmb >= 0 ? '+' : '') + Number(l.delta_rmb).toFixed(2) + '</td><td class="mono">¥' + Number(l.balance_after).toFixed(2) + '</td><td class="muted">' + esc(l.reason) + '</td></tr>').join('')
        : '<tr><td colspan="4" class="muted">暂无流水</td></tr>';
    } catch (e) { /* 401 已处理 */ }
  }

  async function loadAff() {
    try {
      const d = await api('/portal/api/aff');
      $('aff-code').textContent = d.aff_code || '—';
      $('aff-count').textContent = d.invited_count || 0;
      const list = d.invited || [];
      $('aff-list').innerHTML = list.length
        ? list.map((x) => '<tr><td>' + esc(x.username) + '</td><td class="muted">' + fmtTime(x.created_at) + '</td></tr>').join('')
        : '<tr><td colspan="2" class="muted">暂无邀请记录</td></tr>';
    } catch (e) { /* 401 已处理 */ }
  }

  function esc(s) { const d = document.createElement('div'); d.textContent = String(s == null ? '' : s); return d.innerHTML; }

  // P0: 一键复制卡 key
  window.copyKey = function(key) {
    navigator.clipboard.writeText(key).then(() => {
      toast('Key 已复制到剪贴板');
    }).catch(() => {
      // 降级: 手动选择
      const ta = document.createElement('textarea');
      ta.value = key;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      toast('Key 已复制');
    });
  };

  // ── 临时加并发 ──
  window.showBoost = function(cardKey, remainingSecs, paidRmb, planHours) {
    const modal = $('boost-modal');
    const info = $('boost-info');
    const priceEl = $('boost-price');
    const slotsEl = $('boost-slots');
    const remHours = Math.floor(remainingSecs / 3600);
    info.textContent = '卡 ' + cardKey.slice(0, 20) + '… (剩 ' + remHours + 'h)';
    function calcPrice() {
      const slots = parseInt(slotsEl.value) || 1;
      // 按剩余时间折算: 价格 = 原价 × (剩余小时 / 套餐总小时) × 槽数
      const ratio = remainingSecs / (planHours * 3600);
      const price = paidRmb * ratio * slots;
      priceEl.textContent = '¥' + price.toFixed(2) + ' (' + slots + ' 槽 × ' + Math.round(ratio * 100) + '% 剩余时间)';
      return price;
    }
    slotsEl.oninput = calcPrice;
    calcPrice();
    $('boost-confirm').onclick = async () => {
      const slots = parseInt(slotsEl.value) || 1;
      const price = calcPrice();
      if (!confirm('加 ' + slots + ' 个并发槽? 从余额扣 ¥' + price.toFixed(2))) return;
      try {
        const d = await api('/portal/api/boost', { method: 'POST', body: JSON.stringify({ card_key: cardKey, slots: slots }) });
        toast('已加 ' + slots + ' 并发, 新余额 ¥' + d.balance_rmb.toFixed(2));
        modal.style.display = 'none';
        loadCards();
      } catch (e) { toast(e.message, true); }
    };
    $('boost-cancel').onclick = () => { modal.style.display = 'none'; };
    modal.style.display = 'flex';
  };

  // ── 启动: 已有 token 直接进 ──
  if (token) {
    api('/portal/api/me').then((d) => { me = d.user; showApp(); }).catch(() => doLogout());
  }
})();
</script>
</body>
</html>
